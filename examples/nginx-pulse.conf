# Include in the nginx http context. Replace the hostname and certificate paths.
server {
    listen 443 ssl;
    server_name pulse.example.com;
    ssl_certificate /etc/ssl/pulse/fullchain.pem;
    ssl_certificate_key /etc/ssl/pulse/private-key.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    # Avoid logging request URIs: rejected query-token attempts may contain secrets.
    access_log off;
    error_log /var/log/nginx/pulse-error.log crit;
    client_max_body_size 64k;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_next_upstream off;
        proxy_read_timeout 60s;
        proxy_send_timeout 15s;
    }
}
